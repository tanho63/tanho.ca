backend:
  name: github
  repo: tanho63/tanho.ca
  branch: main
  # Sign in with GitHub via a self-hosted OAuth helper on Cloudflare Workers.
  base_url: https://sveltia-cms-auth.dawn-moon-1ad2.workers.dev

publish_mode: editorial_workflow

media_folder: "" # store uploads in the entry's own bundle folder
public_folder: ""

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: posts
    label: Posts
    folder: content/posts
    create: true
    # Page bundles: folder-per-post named YYYY-MM-DD_slug, content in index.md
    path: "{{date}}_{{slug}}/index"
    extension: md
    format: yaml-frontmatter
    editor:
      preview: true
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Summary, name: summary, widget: text, required: false }
      - {
          label: Layout,
          name: layout,
          widget: string,
          required: false,
          hint: 'Overrides the template, e.g. "single"',
        }
      - {
          label: "Custom URL",
          name: url,
          widget: string,
          required: false,
          hint: "Overrides the post's URL path, e.g. /talks/my-talk",
        }
      - {
          label: Aliases,
          name: aliases,
          widget: string,
          required: false,
          hint: "Old URL to redirect from, e.g. /pivot-trick",
        }
      - { label: Date, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
      - {
          label: Tags,
          name: tags,
          widget: list,
          required: false,
          minimize_collapsed: true,
        }
      - {
          label: "Featured image",
          name: featured,
          widget: image,
          required: false,
          hint: "Saved into this post's bundle folder (e.g. featured.jpg)",
        }
      - {
          label: "Hero style",
          name: heroStyle,
          widget: select,
          options: [basic, card, background, thumbAndBackground],
          required: false,
        }
      - {
          label: "Bluesky post ID",
          name: blueskyPostId,
          widget: string,
          required: false,
          hint: "Used to embed Bluesky comments on the post",
        }
      - {
          label: "Table of contents",
          name: showTableOfContents,
          widget: boolean,
          required: false,
        }
      - { label: Body, name: body, widget: markdown }

  - name: now
    label: "Now archive"
    folder: content/now-archive
    create: true
    # Single files, one per entry: YYYY-MM-DD-now.md
    slug: "{{date}}-now"
    extension: md
    format: yaml-frontmatter
    editor:
      preview: true
    fields:
      - { label: Layout, name: layout, widget: hidden, default: now }
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
      - { label: Location, name: location, widget: string, required: false }
      - {
          label: Tags,
          name: tags,
          widget: list,
          default: [now],
          required: false,
          minimize_collapsed: true,
        }
      - { label: Summary, name: summary, widget: text, required: false }
      - { label: Body, name: body, widget: markdown }

  - name: pages
    label: Pages
    editor:
      preview: true
    files:
      - name: home
        label: "Home page"
        file: content/_index.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Description, name: description, widget: string, required: false }
          - { label: Body, name: body, widget: markdown }
      - name: pumpkins
        label: "Pumpkins page"
        file: content/pumpkins/index.md
        fields:
          - { label: Layout, name: layout, widget: hidden, default: simple }
          - { label: Title, name: title, widget: string }
          - { label: Date, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
          - { label: Summary, name: summary, widget: text, required: false }
          - {
              label: "Gallery image",
              name: gallery_upload,
              widget: image,
              required: false,
              choose_url: false,
              hint: "Upload a carve photo — it saves into this bundle and the gallery shortcode auto-picks up every image here. Name it YYYY[eN]_Description.jpg to match existing files. This field itself is not displayed on the site.",
            }
          - { label: Body, name: body, widget: markdown }
